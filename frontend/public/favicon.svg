<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="URY POS">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a4a3e"/>
      <stop offset="100%" stop-color="#1a3229"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c28b"/>
      <stop offset="100%" stop-color="#c39153"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wood)"/>
  <!-- gold ring like brand mark -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity="0.9"/>
  <!-- u. wordmark -->
  <text x="32" y="39" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="url(#gold)">u.</text>
</svg>
